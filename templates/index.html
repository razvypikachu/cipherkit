{% extends "base.html" %}
{% block content %}

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-section-label">MODULES</div>
        <nav class="tool-nav">
            <a href="#" class="tool-link active" data-tool="hash">
                <span class="tool-icon">#</span>
                <div>
                    <div>Hash Checker</div>
                    <div class="tool-desc">MD5 / SHA256 / SHA512</div>
                </div>
            </a>
            <a href="#" class="tool-link" data-tool="password">
                <span class="tool-icon">⬛</span>
                <div>
                    <div>Password Strength</div>
                    <div class="tool-desc">Entropy analyzer</div>
                </div>
            </a>
            <a href="#" class="tool-link" data-tool="encode">
                <span class="tool-icon">⇌</span>
                <div>
                    <div>Encoder / Decoder</div>
                    <div class="tool-desc">Base64 / Hex / URL</div>
                </div>
            </a>
        </nav>
    </aside>

    <div class="tool-panel">
        <div class="tool-panel-header">
            <span class="tool-panel-path">~/cipherkit/</span>
            <span class="tool-panel-name" id="panel-title">Hash Checker</span>
        </div>
        <div class="tool-panel-body">
            <div class="tool-section" id="tool-hash">
                <div class="algo-selector">
                    <button class="algo-btn active" data-algo="MD5">MD5</button>
                    <button class="algo-btn" data-algo="SHA256">SHA256</button>
                    <button class="algo-btn" data-algo="SHA512">SHA512</button>
                </div>
                <textarea id="hash-input" placeholder="Enter text to hash..."></textarea>
                <button class="run-btn" id="run-hash">HASH →</button>
                <div id="hash-output" class="output-box" style="display:none;">
                    <span class="output-label">Result:</span>
                    <span id="hash-result"></span>
                </div>
            </div>
            <div class="tool-section" id="tool-password" style="display:none;">
                <input type="password" id="password-input" placeholder="Enter a password to analyze...">
                <div id="password-result" style="display:none;">
                    <div class="strength-bars">
                        <div class="bar" id="bar-1"></div>
                        <div class="bar" id="bar-2"></div>
                        <div class="bar" id="bar-3"></div>
                        <div class="bar" id="bar-4"></div>
                        <div class="bar" id="bar-5"></div>
                    </div>
                    <div id="strength-label" class="strength-label"></div>
                    <div class="checklist" id="checklist"></div>
                </div>
            </div>
            <div class="tool-section" id="tool-encode" style="display:none;">
                <div class="algo-selector">
                    <button class="algo-btn active" data-format="base64">Base64</button>
                    <button class="algo-btn" data-format="hex">Hex</button>
                    <button class="algo-btn" data-format="url">URL</button>
                </div>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="encode">Encode</button>
                    <button class="mode-btn" data-mode="decode">Decode</button>
                </div>
                <textarea id="encode-input" placeholder="Enter text..."></textarea>
                <button class="run-btn" id="run-encode">RUN →</button>
                <div id="encode-output" class="output-box" style="display:none;">
                    <span class="output-label">Result:</span>
                    <span id="encode-result"></span>
                </div>
            </div>
        
        </div>
    </div>
</div>

{% endblock %}
