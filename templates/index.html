{% extends "base.html" %}
{% block content %}

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-section-label">MODULES</div>
        <nav class="tool-nav">
            <a href="#" class="tool-link active">
                <span class="tool-icon">#</span>
                <div>
                    <div>Hash Checker</div>
                    <div class="tool-desc">MD5 / SHA256 / SHA512</div>
                </div>
            </a>
            <a href="#" class="tool-link">
                <span class="tool-icon">⬛</span>
                <div>
                    <div>Password Strength</div>
                    <div class="tool-desc">Entropy analyzer</div>
                </div>
            </a>
            <a href="#" class="tool-link">
                <span class="tool-icon">⇌</span>
                <div>
                    <div>Encoder / Decoder</div>
                    <div class="tool-desc">Base64 / Hex / URL</div>
                </div>
            </a>
        </nav>
    </aside>

    <div class="tool-panel">
        <div class="tool-panel-header">
            <span class="tool-panel-path">~/cipherkit/</span>
            <span class="tool-panel-name">Hash Checker</span>
        </div>
        <div class="tool-panel-body">
            <div class="algo-selector">
                <button class="algo-btn active" data-algo="MD5">MD5</button>
                <button class="algo-btn" data-algo="SHA256">SHA256</button>
                <button class="algo-btn" data-algo="SHA512">SHA512</button>
            </div>
            <textarea id="hash-input" placeholder="Enter text to hash..."></textarea>
            <button class="run-btn" id="run-hash">HASH →</button>
            <div id="hash-output" class="output box" style="display:none;">
                <span class="output-label">Result:</span>
                <span id="hash-result"></span>
            </div>
        </div>
    </div>
</div>

{% endblock %}
